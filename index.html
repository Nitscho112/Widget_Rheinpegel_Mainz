<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Rhein in Mainz – Pegel</title>
<meta http-equiv="Cache-Control" content="no-store" />
<!--
  Pegel-Widget für das Alamos-Dashboard (Design „Pegellatte“).

  Einstellungen: im Block CONFIG unten oder per URL-Parameter (URL hat Vorrang):
    ?meld=550       Meldehöhe in cm
    ?hw1=610        Hochwassermarke I in cm
    ?hw2=710        Hochwassermarke II in cm
    ?mzb=450        Umsetzen Mehrzweckboote ab … cm
    ?rtb=500        Umsetzen Rettungsboote ab … cm
    ?flb=600        Umsetzen Feuerlöschboot ab … cm
    ?h=48           Zeitraum des Verlaufs in Stunden (Standard 24, max. 720)
    ?prognose=6     Stunden lineare Prognose (0 = aus)
    ?kennwerte=0    PEGELONLINE-Kennwerte (MNW/MW/MHW/HSW) ausblenden
    ?titel=...      eigener Titel
-->
<style>
  :root{
    --bg:#111418; --panel:#1a1e24; --panel-2:#20252c; --fg:#f1f5f9; --muted:#94a3b8; --faint:#64748b;
    --st:#22c55e; --st-fg:#05230f;
    --up:#f87171; --down:#4ade80; --flat:#cbd5e1;
    --u:min(1vw, 1.7vh);
  }
  body[data-status="warn"]  { --st:#f59e0b; --st-fg:#2a1700; }
  body[data-status="alarm"] { --st:#ef4444; --st-fg:#fff; }
  body[data-status="low"]   { --st:#38bdf8; --st-fg:#03202e; }
  body[data-status="unknown"] { --st:#64748b; --st-fg:#fff; }
  body[data-trend="up"]   { --tc:var(--up); }
  body[data-trend="down"] { --tc:var(--down); }

  *{ box-sizing:border-box; }
  html,body{ margin:0; height:100%; overflow:hidden; background:var(--bg); color:var(--fg);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif; font-variant-numeric:tabular-nums; }

  .app{ height:100%; display:grid; grid-template-columns:minmax(150px, 27%) minmax(0,1fr);
    gap:calc(1.4*var(--u)); padding:calc(1.4*var(--u)); }
  .panel{ background:var(--panel); border-radius:14px; min-height:0; min-width:0; position:relative; overflow:hidden; }

  /* ===== Pegellatte ===== */
  .gauge svg{ position:absolute; inset:0; width:100%; height:100%; }
  .gauge .wave{ animation:slide 6s linear infinite; }
  @keyframes slide{ to{ transform:translateX(-60px); } }

  /* ===== Rechte Spalte ===== */
  .right{ display:grid; grid-template-rows:auto auto minmax(0,1fr); gap:calc(1.2*var(--u)); min-height:0; min-width:0; }
  .head{ display:grid; grid-template-columns:auto minmax(0,1fr); align-items:center; column-gap:calc(2.4*var(--u)); }
  .place{ grid-column:1 / -1; font-size:calc(2.2*var(--u)); font-weight:800; letter-spacing:.12em; text-transform:uppercase; color:var(--muted); }
  .num{ line-height:.9; white-space:nowrap; }
  .num b{ font-size:calc(17*var(--u)); font-weight:900; letter-spacing:-.04em; }
  .num span{ font-size:calc(3.6*var(--u)); color:var(--muted); font-weight:700; margin-left:.15em; }
  .side{ display:flex; flex-direction:column; gap:calc(.9*var(--u)); align-items:flex-start; min-width:0; }
  .badge{ background:var(--st); color:var(--st-fg); font-weight:900; font-size:calc(2.6*var(--u)); padding:.25em .8em; border-radius:999px; max-width:100%; }
  body[data-status="alarm"] .badge{ animation:pulse 1.5s infinite; }
  @keyframes pulse{ 50%{ box-shadow:0 0 0 .4em rgba(239,68,68,.35); } }
  .trend{ display:flex; align-items:center; gap:.35em; font-size:calc(3.2*var(--u)); font-weight:900; color:var(--tc, var(--flat)); }
  .trend svg{ width:1em; height:1em; }
  .trend small{ font-size:.6em; font-weight:700; opacity:.85; }
  .facts{ font-size:calc(1.7*var(--u)); color:var(--muted); }
  .facts b{ color:var(--fg); }
  .facts span{ white-space:nowrap; }
  .hint{ font-size:calc(1.8*var(--u)); font-weight:800; color:#fde68a; }
  body[data-status="alarm"] .hint{ color:#fecaca; }
  .hint:empty{ display:none; }

  /* ===== Boote ===== */
  .boats{ display:grid; grid-template-columns:repeat(auto-fit, minmax(0,1fr)); gap:calc(1*var(--u)); }
  .boats:empty{ display:none; }
  .boat{ background:var(--panel-2); border-radius:12px; padding:calc(.8*var(--u)) calc(1.2*var(--u));
    border-left:6px solid var(--bc); display:grid; grid-template-columns:auto 1fr; column-gap:calc(1*var(--u)); align-items:center; min-width:0; }
  .boat .k{ font-size:calc(2.7*var(--u)); font-weight:900; color:var(--bc); grid-row:span 2; }
  .boat .a{ font-size:calc(1.5*var(--u)); color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .boat .s{ font-size:calc(2.2*var(--u)); font-weight:900; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .boat.soon{ background:#3a2a0a; }
  .boat.soon .s{ color:#fbbf24; }
  .boat.now{ background:#b91c1c; border-left-color:#fff; animation:boatBlink 1.2s steps(1) infinite; }
  .boat.now .k, .boat.now .s, .boat.now .a{ color:#fff; }
  .boat.now .s{ overflow:visible; letter-spacing:.02em; }
  @keyframes boatBlink{ 50%{ background:#7f1d1d; } }

  /* ===== Chart ===== */
  .chart svg{ position:absolute; inset:0; width:100%; height:100%; }
  .meta{ position:absolute; right:calc(1.2*var(--u)); top:calc(.8*var(--u)); font-size:calc(1.3*var(--u)); color:var(--muted); z-index:1; }
  .meta.stale{ color:#fca5a5; font-weight:700; }

  /* Hochkant */
  @media (max-aspect-ratio:5/4){
    .app{ grid-template-columns:minmax(110px, 32%) minmax(0,1fr); }
    .head{ grid-template-columns:1fr; row-gap:calc(1*var(--u)); }
    .boats{ grid-template-columns:1fr; }
  }
  /* Flache Kachel: kein Verlauf */
  @media (max-height:330px){
    .chart{ display:none; }
    .right{ grid-template-rows:auto auto; align-content:center; }
  }
  @media (max-height:220px){ .facts, .hint, .place{ display:none; } }

  @media (prefers-reduced-motion: reduce){ .wave, .badge, .boat{ animation:none !important; } }

  .err{ position:fixed; bottom:4px; left:50%; transform:translateX(-50%); font-size:12px; color:#fecaca; background:#7f1d1d; padding:3px 8px; border-radius:6px; z-index:5; }
  .err:empty{ display:none; }
</style>
</head>
<body data-status="unknown">
<main class="app" aria-label="Pegel Rhein in Mainz">
  <section class="panel gauge" aria-hidden="true"><svg id="gauge"></svg></section>
  <section class="right">
    <div class="head">
      <div class="place" id="place">Rhein in Mainz</div>
      <div class="num"><b id="value">--</b><span>cm</span></div>
      <div class="side">
        <div class="badge" id="status">Lade Daten …</div>
        <div class="trend" id="trend"></div>
        <div class="facts" id="facts"></div>
        <div class="hint" id="hint"></div>
      </div>
    </div>
    <div class="boats" id="boats"></div>
    <div class="panel chart"><div class="meta" id="meta"></div><svg id="chart" aria-label="Pegelverlauf mit Prognose"></svg></div>
  </section>
</main>
<div class="err" id="err"></div>

<script>
/* =====================================================================
   KONFIGURATION – hier die Werte für Mainz eintragen (in cm am Pegel).
   null = nicht anzeigen. URL-Parameter überschreiben diese Werte.
   ===================================================================== */
const CONFIG = {
  // Offizielle Marken – bitte mit HVZ Rheinland-Pfalz / ELWIS abgleichen
  marken: [
    { id:"meld", kurz:"Meldehöhe", latte:"Meld.", wert:null, stufe:"warn",  farbe:"#facc15" },
    { id:"hw1",  kurz:"HW-Marke I",  latte:"HW I",  wert:null, stufe:"warn",  farbe:"#f97316" },
    { id:"hw2",  kurz:"HW-Marke II", latte:"HW II", wert:null, stufe:"alarm", farbe:"#ef4444", text:"Schifffahrt eingestellt" },
  ],
  // Ab diesem Pegel müssen die Boote umgesetzt werden
  boote: [
    { id:"mzb", kurz:"MZB", name:"Mehrzweckboote",  wert:null, farbe:"#22d3ee" },
    { id:"rtb", kurz:"RTB", name:"Rettungsboote",   wert:null, farbe:"#a3e635" },
    { id:"flb", kurz:"FLB", name:"Feuerlöschboot",  wert:null, farbe:"#f472b6" },
  ],
  vorwarnungStunden: 24,   // Boot/Marke „bald“ markieren, wenn bei gleichem Anstieg in ≤ X h erreicht
};

const UUID = "a37a9aa3-45e9-4d90-9df6-109f3a28a5af"; // Pegel Mainz
const BASE = "https://www.pegelonline.wsv.de/webservices/rest-api/v2";

const params = new URLSearchParams(location.search);
const numParam = (k, def) => { const v = params.get(k); return v != null && v !== "" && isFinite(+v) ? +v : def; };
for (const m of [...CONFIG.marken, ...CONFIG.boote]) m.wert = numParam(m.id, m.wert);
const RANGE_H     = Math.min(720, Math.max(6, numParam("h", 24)));
const FORECAST_H  = Math.min(48, Math.max(0, numParam("prognose", 6)));
const SHOW_KW     = params.get("kennwerte") !== "0";
const TITLE_OVR   = params.get("titel");
const TREND_WINDOW_H = 2, TREND_THRESH = 0.5, STALE_MIN = 90;

/* Kennwerte aus PEGELONLINE */
const KW_DEFS = { MNW:"#38bdf8", MW:"#94a3b8", MHW:"#c084fc", HSW:"#fb7185" };

const $ = id => document.getElementById(id);
const NS = "http://www.w3.org/2000/svg";
const el = (t, a = {}, txt) => { const e = document.createElementNS(NS, t); for (const k in a) e.setAttribute(k, a[k]); if (txt != null) e.textContent = txt; return e; };
const TZ = "Europe/Berlin";
const fmtDateTime = t => new Intl.DateTimeFormat("de-DE", { timeZone:TZ, weekday:"short", day:"2-digit", month:"2-digit", hour:"2-digit", minute:"2-digit" }).format(t);
const fmtTime = t => new Intl.DateTimeFormat("de-DE", { timeZone:TZ, hour:"2-digit", minute:"2-digit" }).format(t);
const fmtDay = t => new Intl.DateTimeFormat("de-DE", { timeZone:TZ, weekday:"short", day:"2-digit", month:"2-digit" }).format(t);
const tzHour = t => +new Intl.DateTimeFormat("en-GB", { timeZone:TZ, hour:"2-digit", hourCycle:"h23" }).format(t);
const fmtSigned = (v, d = 0) => (v > 0 ? "+" : v < 0 ? "−" : "±") + Math.abs(v).toFixed(d).replace(".", ",");
const fmtEta = h => h < 1 ? "< 1 h" : `ca. ${Math.round(h)} h`;
const rangeLabel = () => RANGE_H >= 48 && RANGE_H % 24 === 0 ? `${RANGE_H / 24} Tage` : `${RANGE_H} h`;
const ARROWS = {
  up:   '<path d="M14 25V4M14 4l8 8M14 4l-8 8" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>',
  down: '<path d="M14 3v21M14 24l8-8M14 24l-8-8" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>',
  flat: '<path d="M3 14h21M24 14l-7-7M24 14l-7 7" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>',
};

async function j(url){
  const r = await fetch(url, { cache:"no-store" });
  if (!r.ok) throw new Error(r.status + " " + r.statusText);
  return r.json();
}

function slopePerHour(points){
  if (points.length < 2) return 0;
  const t0 = points[0].t;
  const xs = points.map(p => (p.t - t0) / 3600e3), ys = points.map(p => p.v);
  const mean = a => a.reduce((x, y) => x + y, 0) / a.length;
  const mx = mean(xs), my = mean(ys);
  let num = 0, den = 0;
  for (let i = 0; i < xs.length; i++){ const dx = xs[i] - mx; num += dx * (ys[i] - my); den += dx * dx; }
  return den === 0 ? 0 : num / den;
}

/* ===== Stammdaten ===== */
let station = null, stationAt = 0, kw = {}, title = "Rhein in Mainz";
async function loadStation(){
  if (station && Date.now() - stationAt < 3600e3) return;
  station = await j(`${BASE}/stations/${UUID}.json?includeTimeseries=true&includeCharacteristicValues=true`);
  stationAt = Date.now();
  const ts = (station.timeseries || []).find(t => t.shortname === "W");
  kw = {};
  for (const cv of ts?.characteristicValues || [])
    if (cv.shortname in KW_DEFS && typeof cv.value === "number") kw[cv.shortname] = Math.round(cv.value);
  title = TITLE_OVR || `${station.water?.longname || "Rhein"} in ${station.longname || "Mainz"}`;
  document.title = `${title} – Pegel`;
}

/* Alle Linien, die gezeichnet werden (Kennwerte, Marken, Boote) */
function allLines(){
  const lines = [];
  if (SHOW_KW) for (const k in kw) lines.push({ kind:"kw", label:k, value:kw[k], color:KW_DEFS[k] });
  for (const m of CONFIG.marken) if (m.wert != null) lines.push({ kind:"mark", label:m.kurz, short:m.latte, value:m.wert, color:m.farbe });
  for (const b of CONFIG.boote)  if (b.wert != null) lines.push({ kind:"boat", label:b.kurz, value:b.wert, color:b.farbe });
  return lines;
}

/* Status: höchste erreichte Marke; ohne eigene Marken Rückfall auf MHW/HSW */
function statusOf(v){
  let stufen = CONFIG.marken.filter(m => m.wert != null)
    .map(m => ({ label:m.kurz, value:m.wert, level:m.stufe, text:m.text }));
  if (!stufen.length){
    if (kw.MHW != null) stufen.push({ label:"MHW", value:kw.MHW, level:"warn" });
    if (kw.HSW != null) stufen.push({ label:"HSW", value:kw.HSW, level:"alarm", text:"Schifffahrt eingestellt" });
  }
  stufen.sort((a, b) => a.value - b.value);
  const reached = stufen.filter(s => v >= s.value).pop();
  const next = stufen.find(s => v < s.value) || null;
  if (reached) return { key:reached.level, text:`${reached.label} überschritten`, sub:reached.text, next, stufen };
  if (kw.MNW != null && v <= kw.MNW) return { key:"low", text:"Niedrigwasser", next, stufen };
  return { key:stufen.length ? "ok" : "unknown", text:stufen.length ? "Normal" : "Aktueller Wasserstand", next, stufen };
}

/* ===== Labels ohne Überlappung ===== */
function spread(items, minGap, top, bottom){
  items.sort((a, b) => a.y - b.y);
  for (let i = 0; i < items.length; i++){
    items[i].ly = Math.max(items[i].y, i ? items[i - 1].ly + minGap : top);
  }
  for (let i = items.length - 1; i >= 0; i--){
    const lim = i < items.length - 1 ? items[i + 1].ly - minGap : bottom;
    if (items[i].ly > lim) items[i].ly = lim;
  }
  return items;
}

/* ===== Pegellatte ===== */
function drawGauge(m){
  const svg = $("gauge"), box = svg.parentElement;
  const W = box.clientWidth, H = box.clientHeight;
  if (!W || !H) return;
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`); svg.innerHTML = "";
  const lines = allLines();
  const vals = [m.last.v, ...lines.map(l => l.value)];
  const lo = Math.max(0, Math.floor((Math.min(...vals) - 80) / 100) * 100);
  const hi = Math.ceil((Math.max(...vals) + 60) / 100) * 100;
  const PT = 18, PB = 18, toY = v => H - PB - (v - lo) / (hi - lo) * (H - PT - PB);
  const fs = Math.max(11, Math.min(17, H / 36, W / 17));

  const sw = Math.min(W * 0.2, 60), sx = W * 0.40 - sw / 2;
  // Latte
  svg.append(el("rect", { x:sx, y:PT - 6, width:sw, height:H - PT - PB + 12, rx:4, fill:"#f8fafc" }));
  // Farbzonen links neben der Latte
  const zx = sx - 11;
  const zone = (a, b, c) => { const y1 = toY(Math.min(b, hi)), y2 = toY(Math.max(a, lo)); if (y2 > y1) svg.append(el("rect", { x:zx, y:y1, width:7, height:y2 - y1, rx:2, fill:c })); };
  const st = m.status.stufen;
  const firstWarn = st.find(s => s.level === "warn")?.value ?? st.find(s => s.level === "alarm")?.value ?? hi;
  const firstAlarm = st.find(s => s.level === "alarm")?.value ?? hi;
  zone(lo, firstWarn, "#22c55e"); zone(firstWarn, firstAlarm, "#f59e0b"); zone(firstAlarm, hi, "#ef4444");
  if (kw.MNW != null) zone(lo, kw.MNW, "#38bdf8");

  // E-Teilung (alle 10 cm, Zahlen alle 50/100 cm)
  for (let v = lo; v <= hi; v += 10){
    const y = toY(v), big = v % 100 === 0, mid = v % 50 === 0;
    svg.append(el("rect", { x:sx, y:y - 1.5, width:big ? sw : mid ? sw * .7 : sw * .4, height:big ? 3 : 2, fill:big ? "#b91c1c" : "#111" }));
    if (big || (mid && (hi - lo) <= 600))
      svg.append(el("text", { x:sx + sw + 5, y:y + fs * .35, fill:big ? "#e2e8f0" : "#94a3b8", "font-size":big ? fs : fs * .85, "font-weight":big ? 800 : 600 }, v));
  }

  // Wasser mit Welle
  const wy = toY(m.last.v);
  const col = { ok:"#3b82f6", unknown:"#3b82f6", low:"#38bdf8", warn:"#f59e0b", alarm:"#ef4444" }[m.status.key];
  let d = `M-60 ${wy}`; for (let x = -60; x <= W + 60; x += 30) d += ` Q ${x + 15} ${wy + ((x / 30) % 2 ? 5 : -5)} ${x + 30} ${wy}`;
  svg.append(el("path", { class:"wave", d:`${d} L ${W + 60} ${H} L -60 ${H} Z`, fill:col, opacity:.42 }));

  // Linien + Beschriftung: Kennwerte & Marken links, Boote rechts
  const left = [], right = [];
  for (const l of lines){
    const y = toY(l.value);
    const isBoat = l.kind === "boat";
    svg.append(el("line", isBoat
      ? { x1:sx, x2:W - 6, y1:y, y2:y, stroke:l.color, "stroke-width":2.5, "stroke-dasharray":"7 4" }
      : { x1:6, x2:sx + sw, y1:y, y2:y, stroke:l.color, "stroke-width":l.kind === "mark" ? 2.5 : 1.5, opacity:l.kind === "mark" ? 1 : .8 }));
    (isBoat ? right : left).push({ y, l });
  }
  const lfs = fs * .78;
  for (const it of spread(left, lfs * 1.15, PT + lfs, H - PB))
    svg.append(el("text", { x:6, y:it.ly - 3, fill:it.l.color, "font-size":lfs, "font-weight":800 }, it.l.short || it.l.label));
  for (const it of spread(right, fs * 1.25, PT + fs, H - PB)){
    svg.append(el("text", { x:W - 6, y:it.ly - 4, fill:it.l.color, "font-size":fs, "font-weight":900, "text-anchor":"end",
      stroke:"#1a1e24", "stroke-width":3, "paint-order":"stroke" }, it.l.label));
  }

  // Zeiger
  const px = sx - 13;
  svg.append(el("path", { d:`M ${px} ${wy} l -12 -9 v 18 z`, fill:"#fff" }));
  svg.append(el("line", { x1:px, x2:sx + sw, y1:wy, y2:wy, stroke:"#fff", "stroke-width":3 }));
}

/* ===== Verlauf ===== */
function drawChart(m){
  const svg = $("chart"), box = svg.parentElement;
  const W = box.clientWidth, H = box.clientHeight;
  if (!W || !H) return;
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`); svg.innerHTML = "";
  const { points, forecast } = m;
  const fs = Math.max(11, Math.min(17, W / 60));
  const PADL = fs * 3.6, PADR = fs * 4.5, PADT = fs * 1.8, PADB = fs * 2.8;
  const minX = points[0].t, nowT = m.last.t;
  const maxX = forecast.length ? forecast[forecast.length - 1].t : nowT;

  const ys = points.map(p => p.v).concat(forecast.map(p => p.v));
  let minY = Math.min(...ys), maxY = Math.max(...ys);
  const near = Math.max(40, (maxY - minY) * 0.6);
  const vis = allLines().filter(l => l.value >= minY - near && l.value <= maxY + near);
  for (const l of vis){ minY = Math.min(minY, l.value); maxY = Math.max(maxY, l.value); }
  if (maxY - minY < 30){ const mid = (minY + maxY) / 2; minY = mid - 15; maxY = mid + 15; }
  const pad = (maxY - minY) * 0.1, plotH = H - PADT - PADB;
  const step = [5, 10, 20, 25, 50, 100, 200, 500].find(s => (maxY - minY + 2 * pad) / s <= Math.max(2, Math.floor(plotH / (fs * 2.6)))) || 1000;
  const y0 = Math.floor((minY - pad) / step) * step, y1 = Math.ceil((maxY + pad) / step) * step;
  const toX = t => PADL + (t - minX) / (maxX - minX) * (W - PADL - PADR);
  const toY = v => H - PADB - (v - y0) / (y1 - y0) * plotH;

  const defs = el("defs"), g = el("linearGradient", { id:"gA", x1:0, y1:0, x2:0, y2:1 });
  g.append(el("stop", { offset:"0%", "stop-color":"#3b82f6", "stop-opacity":.5 }), el("stop", { offset:"100%", "stop-color":"#3b82f6", "stop-opacity":0 }));
  defs.append(g); svg.append(defs);

  // Warn-/Alarmbereich hinterlegen
  const st = m.status.stufen;
  const wv = st.find(s => s.level === "warn")?.value, av = st.find(s => s.level === "alarm")?.value;
  const band = (a, b, c) => { if (a == null) return; a = Math.max(a, y0); b = Math.min(b ?? y1, y1); if (b > a)
    svg.append(el("rect", { x:PADL, y:toY(b), width:W - PADL - PADR, height:toY(a) - toY(b), fill:c })); };
  band(wv, av, "rgba(245,158,11,.10)");
  band(av, null, "rgba(239,68,68,.13)");
  if (forecast.length) svg.append(el("rect", { x:toX(nowT), y:PADT, width:toX(maxX) - toX(nowT), height:plotH, fill:"rgba(255,255,255,.04)" }));

  for (let v = y0; v <= y1 + 1e-6; v += step){
    const y = toY(v);
    svg.append(el("line", { x1:PADL, x2:W - PADR, y1:y, y2:y, stroke:"rgba(255,255,255,.08)" }));
    svg.append(el("text", { x:PADL - fs * .5, y:y + fs * .35, fill:"#a0a6b3", "font-size":fs * .9, "text-anchor":"end" }, v));
  }
  svg.append(el("line", { x1:PADL, x2:W - PADR, y1:H - PADB, y2:H - PADB, stroke:"rgba(255,255,255,.22)" }));
  const spanH = (maxX - minX) / 3600e3, maxTicks = Math.max(2, Math.floor((W - PADL - PADR) / 70));
  const stepH = [1, 2, 3, 4, 6, 12, 24, 48, 72, 168].find(s => spanH / s <= maxTicks) || 168;
  let lastDay = null;
  for (let t = Math.ceil(minX / 3600e3) * 3600e3; t <= maxX; t += 3600e3){
    const h = tzHour(t);
    if (stepH >= 24 ? h !== 0 : h % stepH) continue;
    const x = toX(t), day = fmtDay(t);
    svg.append(el("line", { x1:x, x2:x, y1:H - PADB, y2:H - PADB + 5, stroke:"rgba(255,255,255,.22)" }));
    const lab = el("text", { x, y:H - PADB + fs * 1.2, fill:"#a0a6b3", "font-size":fs * .85, "text-anchor":"middle" });
    if (stepH >= 24) lab.textContent = day;
    else { lab.append(el("tspan", { x, dy:0 }, fmtTime(t))); if (day !== lastDay) lab.append(el("tspan", { x, dy:fs * 1.05, opacity:.7 }, day)); }
    lastDay = day; svg.append(lab);
  }

  // Linien rechts beschriften (ohne Überlappung)
  const labels = [];
  for (const l of vis){
    const y = toY(l.value);
    svg.append(el("line", { x1:PADL, x2:W - PADR, y1:y, y2:y, stroke:l.color, "stroke-width":l.kind === "kw" ? 1.2 : 2,
      "stroke-dasharray":l.kind === "boat" ? "8 4" : "5 5", opacity:l.kind === "kw" ? .8 : 1 }));
    labels.push({ y, l });
  }
  for (const it of spread(labels, fs * 1.05, PADT, H - PADB))
    svg.append(el("text", { x:W - PADR + 6, y:it.ly + fs * .35, fill:it.l.color, "font-size":fs * .8, "font-weight":800 }, `${it.l.short || it.l.label} ${it.l.value}`));

  let d = ""; points.forEach((p, i) => d += `${i ? "L" : "M"}${toX(p.t).toFixed(1)} ${toY(p.v).toFixed(1)}`);
  svg.append(el("path", { d:`${d}L${toX(nowT)} ${H - PADB}L${toX(minX)} ${H - PADB}Z`, fill:"url(#gA)" }));
  const lw = Math.max(2.2, fs * .2);
  svg.append(el("path", { d, fill:"none", stroke:"#93c5fd", "stroke-width":lw, "stroke-linejoin":"round" }));
  if (forecast.length){
    let df = `M${toX(nowT)} ${toY(m.last.v)}`; for (const p of forecast) df += `L${toX(p.t)} ${toY(p.v)}`;
    svg.append(el("path", { d:df, fill:"none", stroke:"#fbbf24", "stroke-width":lw * .85, "stroke-dasharray":"6 5" }));
    const fe = forecast[forecast.length - 1];
    svg.append(el("text", { x:toX(fe.t) - 4, y:toY(fe.v) + (fe.v >= m.last.v ? -8 : fs + 4), fill:"#fbbf24", "font-size":fs * .85, "font-weight":800, "text-anchor":"end" }, `≈${Math.round(fe.v)}`));
  }
  svg.append(el("circle", { cx:toX(nowT), cy:toY(m.last.v), r:fs * .65, fill:"#93c5fd", opacity:.3 }));
  svg.append(el("circle", { cx:toX(nowT), cy:toY(m.last.v), r:fs * .32, fill:"#fff", stroke:"#93c5fd", "stroke-width":2 }));
}

/* ===== Boote ===== */
function renderBoats(m){
  const boats = CONFIG.boote.filter(b => b.wert != null);
  $("boats").innerHTML = boats.map(b => {
    const dist = b.wert - m.last.v;
    let cls = "", s;
    if (dist <= 0){ cls = "now"; s = "UMSETZEN"; }
    else {
      const eta = m.slope > TREND_THRESH ? dist / m.slope : null;
      if (eta != null && eta <= CONFIG.vorwarnungStunden){ cls = "soon"; s = `in ${fmtEta(eta)}`; }
      else s = `noch ${Math.round(dist)} cm`;
    }
    return `<div class="boat ${cls}" style="--bc:${b.farbe}" title="${b.name}: umsetzen ab ${b.wert} cm">
      <span class="k">${b.kurz}</span><span class="a">ab ${b.wert} cm</span><span class="s">${s}</span></div>`;
  }).join("");
}

/* ===== Laden & Anzeigen ===== */
let model = null;
async function load(){
  try{
    try { await loadStation(); } catch(e){ if (!station) console.warn("Stammdaten:", e); }
    const startIso = new Date(Date.now() - RANGE_H * 3600e3).toISOString();
    const ms = await j(`${BASE}/stations/${UUID}/W/measurements.json?start=${encodeURIComponent(startIso)}`);
    const points = (ms || []).filter(x => x?.value != null && x?.timestamp)
      .map(x => ({ t:Date.parse(x.timestamp), v:Number(x.value) })).sort((a, b) => a.t - b.t);
    if (points.length < 2) throw new Error("Zu wenige Messwerte.");
    const last = points[points.length - 1];
    let recent = points.filter(p => p.t >= last.t - TREND_WINDOW_H * 3600e3);
    if (recent.length < 3) recent = points.slice(-3);
    const slope = slopePerHour(recent);
    const forecast = [];
    for (let h = 1; h <= FORECAST_H; h++) forecast.push({ t:last.t + h * 3600e3, v:last.v + slope * h });
    model = { points, last, slope, forecast, status:statusOf(last.v) };
    render(model);
    $("err").textContent = "";
  } catch(err){
    $("err").textContent = "Aktualisierung fehlgeschlagen: " + (err.message || err) + (model ? " – zeige letzte Daten" : "");
  }
}

function render(m){
  const trend = m.slope > TREND_THRESH ? ["up", "steigend"] : m.slope < -TREND_THRESH ? ["down", "fallend"] : ["flat", "gleichbleibend"];
  document.body.dataset.status = m.status.key;
  document.body.dataset.trend = trend[0];
  $("place").textContent = title;
  $("value").textContent = Math.round(m.last.v);
  $("status").textContent = m.status.text + (m.status.sub ? ` – ${m.status.sub}` : "");
  $("trend").innerHTML = `<svg viewBox="0 0 28 28">${ARROWS[trend[0]]}</svg>${trend[1]} <small>${fmtSigned(m.slope, 1)} cm/h</small>`;

  const vals = m.points.map(p => p.v);
  $("facts").innerHTML = [`${rangeLabel()}: <b>${fmtSigned(m.last.v - m.points[0].v)} cm</b>`,
    `Min <b>${Math.round(Math.min(...vals))}</b> · Max <b>${Math.round(Math.max(...vals))}</b>`,
    kw.MW != null ? `zu MW <b>${fmtSigned(m.last.v - kw.MW)}</b>` : ""].filter(Boolean).map(x => `<span>${x}</span>`).join(" · ");

  // Hinweis zur nächsten Marke
  const n = m.status.next;
  let hint = "";
  if (n){
    const eta = m.slope > TREND_THRESH ? (n.value - m.last.v) / m.slope : null;
    hint = eta != null && eta <= CONFIG.vorwarnungStunden
      ? `⚠ ${n.label} (${n.value} cm) bei gleichem Anstieg in ${fmtEta(eta)}`
      : `noch ${Math.round(n.value - m.last.v)} cm bis ${n.label} (${n.value} cm)`;
  }
  $("hint").textContent = hint;

  const ageMin = (Date.now() - m.last.t) / 60e3;
  $("meta").classList.toggle("stale", ageMin > STALE_MIN);
  $("meta").textContent = ageMin > STALE_MIN ? `⚠ Daten veraltet – letzte Messung ${fmtDateTime(m.last.t)}`
    : `Gemessen ${fmtDateTime(m.last.t)} Uhr · PEGELONLINE`;

  renderBoats(m);
  drawGauge(m);
  drawChart(m);
}

new ResizeObserver(() => { if (model){ drawGauge(model); drawChart(model); } }).observe(document.body);
load();
setInterval(load, 60e3);
</script>
